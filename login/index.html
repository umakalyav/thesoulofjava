<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Musea Interior</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #alertBox {
            display: none;
            background-color: #ff3b5c;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            box-shadow: 4px 4px 10px #bec3cf;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="40">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
                <h2>Welcome back</h2>
                <p>Musea Museum Specialist</p>
            </div>
            
            <div id="alertBox"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <div class="neu-input">
                        <input type="text" id="username" name="username" required placeholder="Username">
                    </div>
                </div>
                <div class="form-group">
                    <div class="neu-input">
                        <input type="password" id="password" name="password" required placeholder="Password">
                    </div>
                </div>
                <button type="submit" class="neu-button login-btn">
                    <span>Sign In</span>
                </button>
            </form>
            <div class="signup-link">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        class NeumorphismLoginForm {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.alertBox = document.getElementById('alertBox');
                this.init();
                this.decorate();
            }

            init() {
                this.form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value.trim();
                    try {
                        const res = await fetch("https://herisusanta.my.id/javalogin/api/auth.php", {
                            method: "POST",
                            headers: { "Content-Type": "application/x-www-form-urlencoded" },
                            body: `action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                        });
                        const data = await res.json();
                        if (data.status === "success") {
                            localStorage.setItem("username", data.username);
                            alert("Login Berhasil!");
                            window.location.href = "../index.html"; // Balik ke halaman utama
                        } else {
                            this.alertBox.innerText = "Username atau Password salah!";
                            this.alertBox.style.display = "block";
                            setTimeout(() => { this.alertBox.style.display = "none"; }, 3000);
                        }
                    } catch (error) {
                        alert("Gagal terhubung ke server!");
                    }
                });
            }

            decorate() {
                const card = document.querySelector('.login-card');
                if (card) {
                    document.addEventListener('mousemove', (e) => {
                        const rect = card.getBoundingClientRect();
                        const x = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
                        const y = (e.clientY - rect.top - rect.height / 2) / (rect.height / 2);
                        card.style.boxShadow = `${x * 15}px ${y * 15}px 30px #bec3cf, ${-x * 15}px ${-y * 15}px 30px #ffffff`;
                    });
                }
            }
        }
        document.addEventListener('DOMContentLoaded', () => new NeumorphismLoginForm());
    </script>
</body>
</html>
